# CivicShield application stack.
#   docker compose up --build        → http://localhost:8000
# The deliberately vulnerable test lab is a SEPARATE file (lab/docker-compose.lab.yml)
# so it can never be started by accident alongside a real deployment.

x-app: &app
  build: .
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicshield}
      POSTGRES_DB: ${POSTGRES_DB:-civicshield}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]  # bound to localhost only, never 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicshield}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["celery", "-A", "civicshield.worker.celery_app", "worker", "--loglevel=INFO",
              "--concurrency=2"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *app
    command: ["celery", "-A", "civicshield.worker.celery_app", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
