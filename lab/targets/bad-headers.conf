# Lab target: bad-headers. Valid TLS and redirect, but no security headers at all,
# a version-leaking Server header, and a session cookie without any flags.
server_tokens on;
include /etc/nginx/snippets/redirect-to-https.conf;

server {
    listen 443 ssl default_server;
    ssl_certificate     /certs/bad-headers.pem;
    ssl_certificate_key /certs/bad-headers.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Set-Cookie "sessionid=lab-fake-session; Path=/" always;
    default_type text/plain;
    location / { return 200 "CivicShield lab target: bad-headers\n"; }
}
