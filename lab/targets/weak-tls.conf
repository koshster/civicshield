# Lab target: weak-tls. See lab/ground_truth.yaml for what the scanner should find here.
server_tokens off;
include /etc/nginx/snippets/redirect-to-https.conf;

server {
    listen 443 ssl default_server;
    ssl_certificate     /certs/weak-tls.pem;
    ssl_certificate_key /certs/weak-tls.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers "HIGH:!aNULL:!MD5:!3DES:@SECLEVEL=0";
    include /etc/nginx/snippets/hardened-headers.conf;
    default_type text/plain;
    location / { return 200 "CivicShield lab target: weak-tls\n"; }
}
