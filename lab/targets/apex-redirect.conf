# Lab target: apex-redirect. The common hosted-site shape (Vercel, Netlify, Squarespace):
# the apex 308s to www, both send HSTS, and the page on www lacks the other headers.
# Page-header findings belong on www only; reporting them on the apex too was a real
# false positive from the first smoke test.
server_tokens off;
include /etc/nginx/snippets/redirect-to-https.conf;

server {
    listen 443 ssl;
    server_name apex-redirect.lab.civicshield.test;
    ssl_certificate     /certs/apex-redirect.pem;
    ssl_certificate_key /certs/apex-redirect.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 308 https://www.apex-redirect.lab.civicshield.test$request_uri;
}

server {
    listen 443 ssl default_server;
    ssl_certificate     /certs/apex-redirect.pem;
    ssl_certificate_key /certs/apex-redirect.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    default_type text/plain;
    location / { return 200 "CivicShield lab target: apex-redirect\n"; }
}
