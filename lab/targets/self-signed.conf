# Lab target: self-signed. See lab/ground_truth.yaml for what the scanner should find here.
server_tokens off;
include /etc/nginx/snippets/redirect-to-https.conf;

server {
    listen 443 ssl default_server;
    ssl_certificate     /certs/self-signed.pem;
    ssl_certificate_key /certs/self-signed.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "HIGH:!aNULL:!MD5";
    include /etc/nginx/snippets/hardened-headers.conf;
    default_type text/plain;
    location / { return 200 "CivicShield lab target: self-signed\n"; }
}
