# Lab target: redirector. Sends every request to a host the org never authorized.
# The scanner must record the redirect and NOT follow it (outside's log stays empty).
server_tokens off;
server {
    listen 80 default_server;
    return 302 https://outside.notours.test/;
}
server {
    listen 443 ssl default_server;
    ssl_certificate     /certs/redirector.pem;
    ssl_certificate_key /certs/redirector.key;
    return 302 https://outside.notours.test/;
}
