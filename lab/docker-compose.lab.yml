# CivicShield evaluation lab.
#
# Every container sits on `labnet`, which is `internal: true`: Docker gives it no route to
# the internet, and nothing here publishes a port to the host. The deliberately weak
# targets are therefore reachable only by the lab scanner, never from outside.
#
#   ./lab/run.sh            # generate certs + zones, build, run the eval, tear down
#
name: civicshield-lab

x-target: &target
  image: nginx:1.27-alpine
  restart: "no"
  volumes:
    - ./ca/out:/certs:ro
    - ./targets/snippets:/etc/nginx/snippets:ro

networks:
  labnet:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
      - ./dns/zones:/zones:ro
    networks: { labnet: { ipv4_address: 172.30.0.10 } }

  hardened:
    <<: *target
    volumes: [./ca/out:/certs:ro, ./targets/snippets:/etc/nginx/snippets:ro, ./targets/hardened.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: { labnet: { ipv4_address: 172.30.0.20 } }
  bad-headers:
    <<: *target
    volumes: [./ca/out:/certs:ro, ./targets/snippets:/etc/nginx/snippets:ro, ./targets/bad-headers.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: { labnet: { ipv4_address: 172.30.0.21 } }
  weak-tls:
    <<: *target
    volumes: [./ca/out:/certs:ro, ./targets/snippets:/etc/nginx/snippets:ro, ./targets/weak-tls.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: { labnet: { ipv4_address: 172.30.0.22 } }
  expired-cert:
    <<: *target
    volumes: [./ca/out:/certs:ro, ./targets/snippets:/etc/nginx/snippets:ro, ./targets/expired-cert.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: { labnet: { ipv4_address: 172.30.0.23 } }
  self-signed:
    <<: *target
    volumes: [./ca/out:/certs:ro, ./targets/snippets:/etc/nginx/snippets:ro, ./targets/self-signed.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: { labnet: { ipv4_address: 172.30.0.24 } }
  redirector:
    <<: *target
    volumes: [./ca/out:/certs:ro, ./targets/snippets:/etc/nginx/snippets:ro, ./targets/redirector.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: { labnet: { ipv4_address: 172.30.0.25 } }
  outside:
    <<: *target
    volumes: [./ca/out:/certs:ro, ./targets/snippets:/etc/nginx/snippets:ro, ./targets/outside.conf:/etc/nginx/conf.d/default.conf:ro, ./logs:/var/log/lab]
    networks: { labnet: { ipv4_address: 172.30.0.26 } }
  apex-redirect:
    <<: *target
    volumes: [./ca/out:/certs:ro, ./targets/snippets:/etc/nginx/snippets:ro, ./targets/apex-redirect.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: { labnet: { ipv4_address: 172.30.0.27 } }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civicshield
      POSTGRES_PASSWORD: civicshield
      POSTGRES_DB: civicshield
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicshield"]
      interval: 2s
      retries: 30
    networks: [labnet]

  # The scanner under test: the production image, plus the eval harness mounted in.
  eval:
    build: { context: .., target: app }
    profiles: [eval]
    user: root  # writes zone files and results into bind mounts; lab-only
    depends_on:
      postgres: { condition: service_healthy }
      dns: { condition: service_started }
      hardened: { condition: service_started }
      bad-headers: { condition: service_started }
      weak-tls: { condition: service_started }
      expired-cert: { condition: service_started }
      self-signed: { condition: service_started }
      redirector: { condition: service_started }
      outside: { condition: service_started }
      apex-redirect: { condition: service_started }
    environment:
      CIVICSHIELD_ENV: lab
      CIVICSHIELD_SECRET_KEY: lab-only-not-a-secret-0123456789abcdef
      CIVICSHIELD_DATABASE_URL: postgresql+asyncpg://civicshield:civicshield@postgres:5432/civicshield
      CIVICSHIELD_DNS_NAMESERVERS: 172.30.0.10
      CIVICSHIELD_ALLOWED_PRIVATE_CIDRS: 172.30.0.0/24
      CIVICSHIELD_EXTRA_CA_BUNDLE: /app/lab/ca/out/ca.pem
      CIVICSHIELD_LOG_LEVEL: WARNING
    volumes:
      - ../eval:/app/eval
      - ./:/app/lab
    command: ["sh", "-c", "alembic upgrade head && python -m eval.harness"]
    networks: [labnet]
