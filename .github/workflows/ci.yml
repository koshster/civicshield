name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civicshield
          POSTGRES_PASSWORD: civicshield
          POSTGRES_DB: civicshield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicshield"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CIVICSHIELD_ENV: test
      CIVICSHIELD_TEST_DATABASE_URL: postgresql+asyncpg://civicshield:civicshield@localhost:5432/civicshield_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Tests (unit + integration)
        run: uv run pytest --cov --cov-report=term-missing
      - name: Dependency audit
        run: uvx pip-audit --strict -r <(uv export --frozen --no-dev --no-hashes) || true
